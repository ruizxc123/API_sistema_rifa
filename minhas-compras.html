<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Compras - Rifa Online</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/compras.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/img/logo.svg" alt="Rifa Online">
                    <span>Rifa<span class="highlight">Online</span></span>
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#rifas">Rifas</a>
                <a href="index.html#como-funciona">Como Funciona</a>
            </div>
            
            <div id="user-menu" class="user-menu">
                <!-- Será preenchido via JS -->
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Minhas Compras</h1>
            <p>Histórico completo de todos os seus bilhetes</p>
        </div>

        <div class="compras-filtros">
            <div class="filtros-group">
                <input type="text" id="search-compras" placeholder="🔍 Buscar por rifa ou número..." class="search-input">
                
                <select id="filtro-status">
                    <option value="todos">Todos os status</option>
                    <option value="pago">Pagos</option>
                    <option value="pendente">Pendentes</option>
                    <option value="premiado">Premiados 🏆</option>
                    <option value="perdido">Não premiados</option>
                </select>
                
                <select id="filtro-periodo">
                    <option value="todos">Todo período</option>
                    <option value="30">Últimos 30 dias</option>
                    <option value="90">Últimos 90 dias</option>
                    <option value="2026">2026</option>
                </select>
            </div>
            
            <button id="exportar-compras" class="btn-outline">📥 Exportar</button>
        </div>

        <div class="compras-stats">
            <div class="stat-card">
                <span class="stat-icon">💰</span>
                <div class="stat-info">
                    <span class="stat-label">Total Gasto</span>
                    <span class="stat-value" id="total-gasto">R$ 0,00</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🎫</span>
                <div class="stat-info">
                    <span class="stat-label">Total de Bilhetes</span>
                    <span class="stat-value" id="total-bilhetes">0</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🏆</span>
                <div class="stat-info">
                    <span class="stat-label">Prêmios Ganhos</span>
                    <span class="stat-value" id="total-premios">0</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">⭐</span>
                <div class="stat-info">
                    <span class="stat-label">Taxa de Acerto</span>
                    <span class="stat-value" id="taxa-acerto">0%</span>
                </div>
            </div>
        </div>

        <div class="compras-lista" id="compras-lista">
            <div class="loading-spinner">Carregando seu histórico...</div>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prev-page" class="btn-outline" disabled>Anterior</button>
            <span id="page-info">Página 1</span>
            <button id="next-page" class="btn-outline">Próxima</button>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Rifa Online - Todos os direitos reservados</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/compras.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isLoggedIn = await verificarAutenticacao();
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            
            await carregarHistoricoCompras();
            inicializarFiltros();
        });
    </script>
</body>
</html>
