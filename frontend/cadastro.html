<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Rifa Online</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <span>Rifa<span class="highlight">Online</span></span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#rifas">Rifas</a>
                <a href="index.html#como-funciona">Como Funciona</a>
            </div>
            <div id="user-menu" class="user-menu">
                <a href="login.html" class="btn-outline">Entrar</a>
                <a href="cadastro.html" class="btn-primary active">Cadastrar</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Criar Conta</h2>
                <p>Preencha os dados para começar</p>
            </div>
            
            <form id="cadastro-form" onsubmit="fazerCadastro(event)">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" required placeholder="João Silva">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="joao@email.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="123.456.789-00" oninput="mascaraCPF(this)">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" required placeholder="(11) 99999-9999" oninput="mascaraTelefone(this)">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="senha-confirm">Confirmar Senha</label>
                        <input type="password" id="senha-confirm" required placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary btn-block">Criar Conta</button>
            </form>
            
            <div class="auth-footer">
                <p>Já tem conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </main>

    <footer><div class="container"><p>&copy; 2026 Rifa Online</p></div></footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const session = await API.getSession();
                if (session.usuario_id) window.location.href = 'index.html';
            } catch(e) {}
        });
    </script>
</body>
</html>
