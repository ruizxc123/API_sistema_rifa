<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Rifa Online</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/rifa.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <span>Rifa<span class="highlight">Online</span></span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#rifas">Rifas</a>
                <a href="index.html#como-funciona">Como Funciona</a>
            </div>
            <div id="user-menu" class="user-menu"></div>
        </nav>
    </header>

    <main class="container">
        <div class="admin-header">
            <h1>Meu Perfil</h1>
        </div>

        <div style="display: grid; grid-template-columns: 280px 1fr; gap: 30px;">
            <div class="card" style="height: fit-content;">
                <div style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                        <span id="avatar-iniciais" style="font-size: 2rem; color: white;">U</span>
                    </div>
                    <h3 id="perfil-nome">Carregando...</h3>
                    <p id="perfil-email">email@email.com</p>
                </div>
                <hr style="margin: 20px 0;">
                <nav style="display: flex; flex-direction: column; gap: 10px;">
                <a href="#" onclick="mostrarAba('dados')" class="btn-outline" style="text-align: center;">📋 Dados Pessoais</a>
                <a href="#" id="btn-reservas" onclick="mostrarAba('reservas')" class="btn-outline" style="text-align: center;">⏳ Reservas Ativas</a>
                <a href="#" id="btn-bilhetes" onclick="mostrarAba('bilhetes')" class="btn-outline" style="text-align: center;">🎫 Meus Bilhetes</a>
            </nav>
            </div>

            <div>
                <div id="aba-dados" class="card">
                    <h2>Dados Pessoais</h2>
                    <form id="perfil-form">
                        <div class="form-group"><label>Nome</label><input type="text" id="nome" disabled></div>
                        <div class="form-group"><label>Email</label><input type="email" id="email" disabled></div>
                        <div class="form-group"><label>Telefone</label><input type="text" id="telefone" disabled></div>
                        <div class="form-group"><label>CPF</label><input type="text" id="cpf" disabled></div>
                    </form>
                </div>

                <div id="aba-reservas" class="card" style="display: none;">
                    <h2>⏳ Reservas Ativas</h2>
                    <div id="reservas-container">Carregando...</div>
                </div>

                <div id="aba-bilhetes" class="card" style="display: none;">
                    <h2>🎫 Meus Bilhetes</h2>
                    <div id="bilhetes-container">Carregando...</div>
                </div>
            </div>
        </div>
    </main>

    <footer><div class="container"><p>&copy; 2026 Rifa Online</p></div></footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
