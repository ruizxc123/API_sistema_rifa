<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Rifa - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <span>Rifa<span class="highlight">Online</span></span>
                </a>
            </div>
            <div class="nav-links">
                <a href="admin.html">Dashboard</a>
                <a href="admin-criar-rifa.html">Nova Rifa</a>
                <a href="index.html">Ver Site</a>
            </div>
            <div id="user-menu" class="user-menu"></div>
        </nav>
    </header>

    <main class="container">
        <div class="admin-header">
            <a href="admin.html" class="btn-outline">← Voltar</a>
            <h1>➕ Criar Nova Rifa</h1>
        </div>

        <div class="card">
            <form id="criar-rifa-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome da Rifa *</label>
                        <input type="text" id="nome" required placeholder="Ex: Nintendo Switch">
                    </div>
                    <div class="form-group">
                        <label for="valor_bilhete">Valor do Bilhete (R$) *</label>
                        <input type="number" id="valor_bilhete" required step="0.01" min="0.01" placeholder="10.00">
                    </div>
                </div>

                <div class="form-group">
                    <label for="premio">Prêmio *</label>
                    <input type="text" id="premio" required placeholder="Ex: 1 Nintendo Switch OLED + 2 Jogos">
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição *</label>
                    <textarea id="descricao" rows="4" required placeholder="Descreva a rifa..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="total_numeros">Total de Números *</label>
                        <input type="number" id="total_numeros" required min="1" max="1000" placeholder="100">
                    </div>
                    <div class="form-group">
                        <label for="data_sorteio">Data do Sorteio *</label>
                        <input type="datetime-local" id="data_sorteio" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagem">URL da Imagem</label>
                    <input type="url" id="imagem" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-outline" onclick="window.location.href='admin.html'">Cancelar</button>
                    <button type="submit" class="btn-primary">Criar Rifa</button>
                </div>
            </form>
        </div>
    </main>

    <footer><div class="container"><p>&copy; 2026 Rifa Online</p></div></footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await verificarAutenticacao();
            
            const session = await API.getSession();
            if (session.usuario?.tipo !== 'admin') {
                window.location.href = 'index.html';
                return;
            }
            
            const minDate = new Date();
            minDate.setDate(minDate.getDate() + 7);
            document.getElementById('data_sorteio').min = minDate.toISOString().slice(0, 16);
        });
        
        document.getElementById('criar-rifa-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                premio: document.getElementById('premio').value,
                valor_bilhete: parseFloat(document.getElementById('valor_bilhete').value),
                total_numeros: parseInt(document.getElementById('total_numeros').value),
                data_sorteio: document.getElementById('data_sorteio').value,
                imagem: document.getElementById('imagem').value
            };
            
            loading(true);
            try {
                const response = await fetch(`${CONFIG.API_URL}/admin/rifas`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                
                if (response.ok && result.sucesso) {
                    mostrarMensagem('✅ Rifa criada com sucesso!', 'success');
                    setTimeout(() => window.location.href = 'admin.html', 1500);
                } else {
                    mostrarMensagem(result.erro || 'Erro ao criar', 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro ao criar rifa', 'error');
            } finally { loading(false); }
        });
    </script>
</body>
</html>
