<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Rifa Online</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/img/image.png" width="3em" alt="Rifa Online">
                    <span>Rifa<span class="highlight">Online</span></span>
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#rifas">Rifas</a>
                <a href="index.html#como-funciona">Como Funciona</a>
            </div>
            
            <div id="user-menu" class="user-menu">
                <a href="login.html" class="btn-outline">Entrar</a>
                <a href="cadastro.html" class="btn-primary active">Cadastrar</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Criar Conta</h2>
                <p>Preencha os dados para começar</p>
            </div>
            
            <form id="cadastro-form" onsubmit="fazerCadastro(event)">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="João Silva">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="joao@email.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="123.456.789-00" oninput="mascaraCPF(this)">
                    </div>
                    
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" required placeholder="(11) 99999-9999" oninput="mascaraTelefone(this)">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="toggleSenha('senha')">👁️</button>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha-confirm">Confirmar Senha</label>
                        <input type="password" id="senha-confirm" name="senha-confirm" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="toggleSenha('senha-confirm')">👁️</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox">
                        <input type="checkbox" required>
                        Eu aceito os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary btn-block">Criar Conta</button>
            </form>
            
            <div class="auth-footer">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Rifa Online - Todos os direitos reservados</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function toggleSenha(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Se já estiver logado, redireciona
            try {
                const session = await API.getSession();
                if (session.usuario_id) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                // Continua
            }
        });
    </script>
</body>
</html>
