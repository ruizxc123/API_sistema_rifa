<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Compras - Rifa Online</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .bilhete-card {
            border: 1px solid var(--light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            background: white;
        }
        .bilhete-card.premiado {
            background: linear-gradient(135deg, #fef3c7, #fff9e6);
            border-left: 4px solid #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }
        .bilhete-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .bilhete-rifa {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
        }
        .bilhete-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-premiado {
            background: #f59e0b;
            color: white;
        }
        .status-normal {
            background: var(--gray);
            color: white;
        }
        .bilhete-numero {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            color: var(--primary);
            margin: 10px 0;
        }
        .bilhete-premio {
            color: var(--warning);
            font-weight: bold;
            margin-top: 10px;
            padding: 10px;
            background: #fef3c7;
            border-radius: 8px;
        }
        .bilhete-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
            color: var(--gray);
            font-size: 0.9rem;
        }
        .premiado-badge {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="index.html">
                    <span style="font-size: 1.5rem; font-weight: bold;">Rifa<span style="color: #3b82f6;">Online</span></span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#rifas">Rifas</a>
                <a href="index.html#como-funciona">Como Funciona</a>
            </div>
            <div id="user-menu" class="user-menu"></div>
        </nav>
    </header>

    <main class="container">
        <div class="admin-header">
            <h1>🎫 Meus Bilhetes</h1>
            <p>Histórico de todos os seus bilhetes comprados</p>
        </div>

        <div id="bilhetes-container" class="bilhetes-lista">
            <div class="loading-spinner">Carregando seus bilhetes...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 RifaOnline - Todos os direitos reservados</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await verificarAutenticacao();
            await carregarBilhetes();
        });
        
        async function carregarBilhetes() {
            const container = document.getElementById('bilhetes-container');
            
            try {
                const bilhetes = await API.getMeusBilhetes();
                console.log('📦 Bilhetes:', bilhetes);
                
                if (!bilhetes || bilhetes.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎫</div>
                            <h3>Você ainda não possui bilhetes</h3>
                            <p>Compre números e concorra a prêmios incríveis!</p>
                            <a href="index.html#rifas" class="btn-primary">Ver Rifas</a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = bilhetes.map(b => `
                    <div class="bilhete-card ${b.premiado ? 'premiado' : ''}">
                        <div class="bilhete-header">
                            <span class="bilhete-rifa">🎲 ${b.rifa_nome}</span>
                            ${b.premiado ? '<span class="bilhete-status status-premiado">🏆 PREMIADO!</span>' : '<span class="bilhete-status status-normal">✅ Normal</span>'}
                        </div>
                        <div class="bilhete-numero">
                            Número: ${b.numero.toString().padStart(3, '0')}
                        </div>
                        ${b.premiado ? `
                            <div class="bilhete-premio">
                                🎉 PARABÉNS! Você ganhou o sorteio da rifa "${b.rifa_nome}" com o número ${b.numero.toString().padStart(3, '0')}!
                                <br>
                                <strong>Prêmio: ${b.premio}</strong>
                            </div>
                        ` : ''}
                        <div class="bilhete-info">
                            <span>💰 Valor: ${formatarMoeda(b.valor)}</span>
                            <span>📅 Comprado em: ${formatarDataHora(b.data_compra)}</span>
                            <span>🎯 Sorteio: ${formatarDataHora(b.data_sorteio)}</span>
                            ${b.numero_sorteado ? `<span>🔢 Número sorteado: ${b.numero_sorteado.toString().padStart(3, '0')}</span>` : ''}
                        </div>
                    </div>
                `).join('');
                
                // Contar premiados
                const premiados = bilhetes.filter(b => b.premiado).length;
                if (premiados > 0) {
                    mostrarMensagem(`🎉 Você tem ${premiados} bilhete(s) premiado(s)!`, 'success');
                }
                
            } catch (error) {
                console.error('❌ Erro:', error);
                container.innerHTML = '<p class="error">Erro ao carregar bilhetes. Tente novamente.</p>';
            }
        }
    </script>
</body>
</html>
